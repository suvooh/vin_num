[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinplate"
version = "0.2.0"
description = "India-specific vehicle plate + VIN reading, authenticity and capture-quality pipeline"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy", "onnxruntime"]

[project.optional-dependencies]
train = ["torch", "pyyaml", "tqdm", "fonttools", "onnx"]
dev = ["pytest"]

# Only the inference package is installable; synth/, training/, export/, eval/ stay repo-local tools.
# Model files are found via $VINPLATE_MODELS, <repo>/models or <repo>/app/assets/models
# (vinplate.runtime.find_model), so install it editable (`pip install -e ml`) from this repo.
[tool.setuptools.packages.find]
include = ["vinplate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
